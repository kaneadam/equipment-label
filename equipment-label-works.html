<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label Editor – Rev 14</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      color: #222;
    }
    .app {
      max-width: 1200px;
      margin: 16px auto;
      padding: 16px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    h1 { margin-top: 0; font-size: 20px; }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .toolbar-left {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      flex: 1;
    }
    .toolbar-right {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toolbar input {
      width: 70px;
      padding: 4px;
    }
    .toolbar button {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      background: #fafafa;
      border-radius: 4px;
      cursor: pointer;
    }

    .rev-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 12px;
    }

    .info-box {
      background: #e8f4f8;
      border: 1px solid #0078d4;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #005a9c;
    }

    .layout {
      display: grid;
      grid-template-columns: 500px 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      background: #fafafa;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .editor-wrapper {
      width: 500px;
      height: calc(500px * 812 / 1218);
      border: 2px solid #333;
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    .editor-grid {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: top left;
      display: grid;
      background: #fff;
    }

    .editor-cell {
      border: 1px solid #ddd;
      padding: 4px;
      font-size: 20px; /* base, overridden per row */
      overflow: hidden;
      outline: none;
      white-space: nowrap;
    }
    .editor-cell:focus {
      box-shadow: inset 0 0 0 1px #0078d4;
    }

    .col-resize-handle,
    .row-resize-handle {
      position: absolute;
      background: rgba(0,0,0,0.05);
      transition: background 0.15s;
      z-index: 10;
    }
    .col-resize-handle:hover,
    .row-resize-handle:hover {
      background: rgba(0,0,0,0.25);
    }

    .col-resize-handle {
      width: 6px;
      cursor: col-resize;
      top: 0;
    }
    .row-resize-handle {
      height: 6px;
      cursor: row-resize;
      left: 0;
    }

    .preview-wrapper {
      border: 2px solid #333;
      border-radius: 4px;
      background: #fff;
      padding: 4px;
      overflow: auto;
      max-height: 600px;
    }
    .preview-inner svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .note {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Label Editor</h1>

  <div class="toolbar">
    <div class="toolbar-left">
      <label>Rows: <input id="rowsInput" type="number" min="1" max="20" value="3"></label>
      <label>Cols: <input id="colsInput" type="number" min="1" max="20" value="3"></label>
      <label>Margin: <input id="marginAll" type="number" value="20"></label>
      <button id="applyGridBtn">Apply Grid</button>
      <button id="printBtn">Print Label</button>
    </div>
    <div class="toolbar-right">
      <button id="mergeRightBtn">Merge →</button>
      <button id="resetMergesBtn">Reset Merges</button>
    </div>
  </div>

  <div class="rev-label">Revision: <span id="revDisplay">14</span></div>

  <div class="info-box">
    ✓ Label: 6" × 4" (1218×812px) | Margin: <span id="marginDisplay">20</span>px | 
    Cell size: <span id="cellSizeDisplay">393 × 257</span>px
  </div>

  <p class="note">
    Horizontal merging only. Text auto‑fits per row (comfort fit ≈80% of row height).  
    All grids automatically scale to fit your label—try any number of rows/columns!
  </p>

  <div class="layout">
    <div class="panel">
      <div class="panel-title">Editor</div>
      <div class="editor-wrapper">
        <div class="editor-grid" id="editorGrid"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">SVG Preview (1218×812)</div>
      <div class="preview-wrapper">
        <div class="preview-inner" id="previewContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
  let revision = 14;

  const LABEL_WIDTH = 1218;
  const LABEL_HEIGHT = 812;

  const state = {
    rows: 3,
    cols: 3,
    margin: 20,
    colWidths: [],
    rowHeights: [],
    rowFontSizes: [],
    cells: [],
    hMerges: [],
    selection: { row: null, col: null }
  };

  const editorGrid = document.getElementById('editorGrid');
  const previewContainer = document.getElementById('previewContainer');
  const revDisplay = document.getElementById('revDisplay');
  const cellSizeDisplay = document.getElementById('cellSizeDisplay');
  const marginDisplay = document.getElementById('marginDisplay');

  function initCells() {
    state.cells = [];
    for (let r = 0; r < state.rows; r++) {
      const row = [];
      for (let c = 0; c < state.cols; c++) {
        row.push({ text: '' });
      }
      state.cells.push(row);
    }
    state.hMerges = [];
    state.selection = { row: null, col: null };
  }

  function initColWidths() {
    const innerWidth = LABEL_WIDTH - state.margin * 2;
    const even = innerWidth / state.cols;
    state.colWidths = Array(state.cols).fill(even);
  }

  function initRowHeights() {
    const innerHeight = LABEL_HEIGHT - state.margin * 2;
    const even = innerHeight / state.rows;
    state.rowHeights = Array(state.rows).fill(even);
    state.rowFontSizes = Array(state.rows).fill(20);
  }

  function updateInfoBox() {
    const colWidth = Math.round((LABEL_WIDTH - state.margin * 2) / state.cols);
    const rowHeight = Math.round((LABEL_HEIGHT - state.margin * 2) / state.rows);
    cellSizeDisplay.textContent = `${colWidth} × ${rowHeight}`;
    marginDisplay.textContent = state.margin;
  }

  function findHorizontalMergeAt(r, c) {
    return state.hMerges.find(m => m.r === r && c >= m.c && c < m.c + m.colSpan) || null;
  }

  function isCoveredByHorizontal(r, c) {
    const m = findHorizontalMergeAt(r, c);
    if (!m) return false;
    return m.c !== c;
  }

  function buildEditor() {
    editorGrid.innerHTML = '';

    const totalWidth = state.colWidths.reduce((a,b)=>a+b,0);
    const totalHeight = state.rowHeights.reduce((a,b)=>a+b,0);

    const wrapper = document.querySelector('.editor-wrapper');
    const wrapperWidth = wrapper.clientWidth;
    const wrapperHeight = wrapper.clientHeight;

    const scaleX = wrapperWidth / totalWidth;
    const scaleY = wrapperHeight / totalHeight;
    const scale = Math.min(scaleX, scaleY);

    editorGrid.style.transform = `scale(${scale})`;
    editorGrid.style.width = totalWidth + "px";
    editorGrid.style.height = totalHeight + "px";

    editorGrid.style.gridTemplateColumns = state.colWidths.map(w => `${w}px`).join(' ');
    editorGrid.style.gridTemplateRows = state.rowHeights.map(h => `${h}px`).join(' ');

    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        if (isCoveredByHorizontal(r, c)) continue;

        const cellEl = document.createElement('div');
        cellEl.className = 'editor-cell';
        cellEl.contentEditable = 'true';
        cellEl.dataset.row = r;
        cellEl.dataset.col = c;

        const hMerge = state.hMerges.find(m => m.r === r && m.c === c);
        if (hMerge) {
          cellEl.style.gridColumn = `span ${hMerge.colSpan}`;
        }

        cellEl.style.fontSize = state.rowFontSizes[r] + "px";
        cellEl.textContent = state.cells[r][c].text;
        editorGrid.appendChild(cellEl);
      }
    }

    addColumnHandles(scale);
    addRowHandles(scale);
  }

  function escapeXml(str) {
    return str.replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
  }

  function renderSvg() {
    const m = state.margin;

    const innerWidth = LABEL_WIDTH - m * 2;
    const innerHeight = LABEL_HEIGHT - m * 2;

    const colSum = state.colWidths.reduce((a,b)=>a+b,0);
    const rowSum = state.rowHeights.reduce((a,b)=>a+b,0);

    const colScale = innerWidth / colSum;
    const rowScale = innerHeight / rowSum;

    const scaledCols = state.colWidths.map(w => w * colScale);
    const scaledRows = state.rowHeights.map(h => h * rowScale);

    let svg = `<svg width="${LABEL_WIDTH}" height="${LABEL_HEIGHT}" viewBox="0 0 ${LABEL_WIDTH} ${LABEL_HEIGHT}" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<rect x="0" y="0" width="${LABEL_WIDTH}" height="${LABEL_HEIGHT}" fill="white"/>`;

    let y = m;
    for (let r = 0; r < state.rows; r++) {
      let x = m;
      for (let c = 0; c < state.cols; c++) {
        if (isCoveredByHorizontal(r, c)) {
          x += scaledCols[c];
          continue;
        }

        const hMerge = findHorizontalMergeAt(r, c);

        let w = scaledCols[c];
        if (hMerge) {
          for (let k = 1; k < hMerge.colSpan; k++) {
            w += scaledCols[c + k];
          }
        }

        const h = scaledRows[r];
        svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#000" stroke-width="1"/>`;

        const text = state.cells[r][c].text;
        if (text) {
          const cx = x + w / 2;
          const cy = y + h / 2;
          const svgFont = state.rowFontSizes[r] * 1.4;
          svg += `<text x="${cx}" y="${cy}" font-family="sans-serif" font-size="${svgFont}" text-anchor="middle" dominant-baseline="middle">${escapeXml(text)}</text>`;
        }

        x += w;
      }
      y += scaledRows[r];
    }

    svg += `</svg>`;
    previewContainer.innerHTML = svg;
  }

  function measureTextHeight(text, fontSize) {
    const temp = document.createElement("div");
    temp.style.position = "absolute";
    temp.style.visibility = "hidden";
    temp.style.fontSize = fontSize + "px";
    temp.style.fontFamily = "system-ui, sans-serif";
    temp.style.whiteSpace = "nowrap";
    temp.textContent = text;
    document.body.appendChild(temp);
    const h = temp.offsetHeight;
    temp.remove();
    return h;
  }

  function autoFitRow(r) {
    const rowHeight = state.rowHeights[r];
    const maxFont = 40;
    const minFont = 8;

    let targetFont = maxFont;
    let hasText = false;

    for (let c = 0; c < state.cols; c++) {
      if (isCoveredByHorizontal(r, c)) continue;

      const text = state.cells[r][c].text;
      if (!text) continue;
      hasText = true;

      let font = maxFont;
      while (font >= minFont) {
        const h = measureTextHeight(text, font);
        if (h <= rowHeight * 0.8) break;
        font--;
      }
      targetFont = Math.min(targetFont, font);
    }

    state.rowFontSizes[r] = hasText ? targetFont : 20;
  }

  function autoFitAllRows() {
    for (let r = 0; r < state.rows; r++) {
      autoFitRow(r);
    }
  }

  function updateRowFontInEditor(r) {
    const cells = editorGrid.querySelectorAll(`.editor-cell[data-row="${r}"]`);
    cells.forEach(cell => {
      cell.style.fontSize = state.rowFontSizes[r] + "px";
    });
  }

  let autoFitTimer = null;

  function scheduleAutoFitRow(r) {
    clearTimeout(autoFitTimer);
    autoFitTimer = setTimeout(() => {
      autoFitRow(r);
      updateRowFontInEditor(r);
      renderSvg();
    }, 80);
  }

  editorGrid.addEventListener('input', (e) => {
    const cell = e.target.closest('.editor-cell');
    if (!cell) return;
    const r = parseInt(cell.dataset.row, 10);
    const c = parseInt(cell.dataset.col, 10);
    state.cells[r][c].text = cell.textContent || '';
    scheduleAutoFitRow(r);
  });

  editorGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.editor-cell');
    if (!cell) return;

    const r = parseInt(cell.dataset.row, 10);
    const c = parseInt(cell.dataset.col, 10);

    const hMerge = findHorizontalMergeAt(r, c);
    if (hMerge) {
      state.selection = { row: hMerge.r, col: hMerge.c };
    } else {
      state.selection = { row: r, col: c };
    }
  });

  // COLUMN DRAGGING
  let activeCol = null;
  let startX = 0;
  let startColWidth = 0;
  let neighborColWidth = 0;

  function addColumnHandles(scale) {
    document.querySelectorAll('.col-resize-handle').forEach(h => h.remove());

    let x = 0;

    for (let c = 0; c < state.cols - 1; c++) {
      x += state.colWidths[c];

      const handle = document.createElement('div');
      handle.className = 'col-resize-handle';
      handle.style.left = `${x * scale - 3}px`;
      handle.style.height = `100%`;
      handle.dataset.col = c;

      editorGrid.parentElement.appendChild(handle);

      handle.addEventListener('mousedown', (e) => {
        activeCol = handle;
        startX = e.clientX;
        const idx = parseInt(handle.dataset.col, 10);
        startColWidth = state.colWidths[idx];
        neighborColWidth = state.colWidths[idx + 1];
        e.preventDefault();
      });
    }
  }

  // ROW DRAGGING
  let activeRow = null;
  let startY = 0;
  let startRowHeight = 0;
  let neighborRowHeight = 0;

  function addRowHandles(scale) {
    document.querySelectorAll('.row-resize-handle').forEach(h => h.remove());

    let y = 0;

    for (let r = 0; r < state.rows - 1; r++) {
      y += state.rowHeights[r];

      const handle = document.createElement('div');
      handle.className = 'row-resize-handle';
      handle.style.top = `${y * scale - 3}px`;
      handle.style.width = `100%`;
      handle.dataset.row = r;

      editorGrid.parentElement.appendChild(handle);

      handle.addEventListener('mousedown', (e) => {
        activeRow = handle;
        startY = e.clientY;
        const idx = parseInt(handle.dataset.row, 10);
        startRowHeight = state.rowHeights[idx];
        neighborRowHeight = state.rowHeights[idx + 1];
        e.preventDefault();
      });
    }
  }

  window.addEventListener('mousemove', (e) => {
    if (activeCol) {
      const idx = parseInt(activeCol.dataset.col, 10);
      const dx = (e.clientX - startX) * 1.5;

      const minWidth = 20;

      let left = startColWidth + dx;
      let right = neighborColWidth - dx;

      if (left < minWidth) {
        left = minWidth;
        right = startColWidth + neighborColWidth - left;
      } else if (right < minWidth) {
        right = minWidth;
        left = startColWidth + neighborColWidth - right;
      }

      state.colWidths[idx] = left;
      state.colWidths[idx + 1] = right;

      autoFitAllRows();
      buildEditor();
      renderSvg();
    }

    if (activeRow) {
      const idx = parseInt(activeRow.dataset.row, 10);
      const dy = (e.clientY - startY) * 1.5;

      const minHeight = 20;

      let top = startRowHeight + dy;
      let bottom = neighborRowHeight - dy;

      if (top < minHeight) {
        top = minHeight;
        bottom = startRowHeight + neighborRowHeight - top;
      } else if (bottom < minHeight) {
        bottom = minHeight;
        top = startRowHeight + neighborRowHeight - bottom;
      }

      state.rowHeights[idx] = top;
      state.rowHeights[idx + 1] = bottom;

      autoFitAllRows();
      buildEditor();
      renderSvg();
    }
  });

  window.addEventListener('mouseup', () => {
    activeCol = null;
    activeRow = null;
  });

  function applyHorizontalMerge(row, startCol, endCol) {
    if (row == null) return;
    if (startCol == null || endCol == null) return;

    const s = Math.min(startCol, endCol);
    const e = Math.max(startCol, endCol);
    if (s === e) return;

    state.hMerges = state.hMerges.filter(m => {
      if (m.r !== row) return true;
      const ms = m.c;
      const me = m.c + m.colSpan - 1;
      return me < s || ms > e;
    });

    state.hMerges.push({ r: row, c: s, colSpan: e - s + 1 });

    state.selection = { row, col: s };

    autoFitRow(row);
    buildEditor();
    renderSvg();
  }

  document.getElementById('mergeRightBtn').addEventListener('click', () => {
    if (state.selection.row === null || state.selection.col === null) return;

    const row = state.selection.row;
    const baseCol = state.selection.col;

    const hMerge = findHorizontalMergeAt(row, baseCol);
    let startCol = baseCol;
    let endCol = baseCol;

    if (hMerge) {
      startCol = hMerge.c;
      endCol = hMerge.c + hMerge.colSpan - 1;
    }

    const targetCol = endCol + 1;
    if (targetCol >= state.cols) return;

    applyHorizontalMerge(row, startCol, targetCol);
  });

  document.getElementById('resetMergesBtn').addEventListener('click', () => {
    state.hMerges = [];
    state.selection = { row: null, col: null };
    autoFitAllRows();
    buildEditor();
    renderSvg();
  });

  document.getElementById('applyGridBtn').addEventListener('click', () => {
    revision++;
    revDisplay.textContent = revision;

    state.rows = parseInt(document.getElementById('rowsInput').value, 10);
    state.cols = parseInt(document.getElementById('colsInput').value, 10);
    state.margin = parseInt(document.getElementById('marginAll').value, 10);

    initCells();
    initColWidths();
    initRowHeights();
    updateInfoBox();
    autoFitAllRows();
    buildEditor();
    renderSvg();
  });

  document.getElementById('printBtn').addEventListener('click', () => {
    const svg = previewContainer.innerHTML.trim();

    const win = window.open('', '_blank', 'width=1300,height=900');
    if (!win) return;

    win.document.open();
    win.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8">
        <title>Print Label</title>
        <style>
          @page {
            margin: 0;
            size: 6in 4in;
          }
          html, body {
            margin: 0;
            padding: 0;
            width: 6in;
            height: 4in;
            overflow: hidden;
          }
          svg {
            width: 6in;
            height: 4in;
            position: absolute;
            top: 0;
            left: 0;
          }
        </style>
      </head>
      <body>
        ${svg}
        <script>
          window.onload = () => setTimeout(() => window.print(), 50);
        <\/script>
      </body>
      </html>
    `);

    win.document.close();
  });

  // Initial render (after layout is ready)
  window.addEventListener('load', () => {
    initCells();
    initColWidths();
    initRowHeights();
    updateInfoBox();
    autoFitAllRows();
    buildEditor();
    renderSvg();
  });
</script>
</body>
</html>
